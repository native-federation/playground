@if (navIntent(); as intent) {
  <a [class]="buttonClass()" [navIntent]="intent" [attr.title]="title()">
    <ng-container *ngTemplateOutlet="inner"></ng-container>
  </a>
} @else {
  <button
    [class]="buttonClass()"
    [type]="type()"
    [attr.title]="title()"
    [disabled]="disabled()"
  >
    <ng-container *ngTemplateOutlet="inner"></ng-container>
  </button>
}

<ng-template #inner>
  <div class="c_Button__inner"><ng-content></ng-content></div>
</ng-template>
