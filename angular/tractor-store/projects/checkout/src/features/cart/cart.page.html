<mfe-header mfeRemote="@tractor-store/explore"></mfe-header>
<main class="c_CartPage">
  <h2>Basket</h2>
  <ul class="c_CartPage__lineItems" role="list">
    @for (item of lineItems(); track item.sku) {
    <app-line-item [item]="item"></app-line-item>
    }
  </ul>
  <hr />
  <p class="c_CartPage__total">Total: {{ total() }},00 Ø</p>

  <div class="c_CartPage__buttons">
    <app-button variant="primary" [navIntent]="'checkout.checkout'"
      >Checkout</app-button
    >
    <app-button variant="secondary" [navIntent]="'explore.home'"
      >Continue Shopping</app-button
    >
  </div>

  <mfe-recommendations
    mfeRemote="@tractor-store/explore"
    [attr.skus]="skusCsv()"
  ></mfe-recommendations>
</main>
<mfe-footer mfeRemote="@tractor-store/explore"></mfe-footer>
