<mfe-header mfeRemote="@tractor-store/explore"></mfe-header>
<main class="e_HomePage">
  @for (t of teasers(); track t.title) {
  <a
    class="e_HomePage__categoryLink"
    [navIntent]="t.link.intent"
    [navPayload]="t.link.params ?? {}"
  >
    <img
      [ngSrc]="t.image"
      ngSrcset="500w, 1000w"
      sizes="100vw, (min-width: 500px) 50vw"
      width="500"
      height="280"
      [loaderParams]="{ size: 500 }"
      alt=""
    />
    {{ t.title }}
  </a>
  }
  <div class="e_HomePage__recommendations">
    <mfe-recommendations
      mfeRemote="@tractor-store/explore"
      skus="CL-01-GY,AU-07-MT"
    ></mfe-recommendations>
  </div>
</main>
<mfe-footer mfeRemote="@tractor-store/explore"></mfe-footer>
