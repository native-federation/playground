<mat-card appearance="outlined">
  <mat-card-header>
    <h1 mat-card-title>{{ profile.name }}</h1>
  </mat-card-header>
  <mat-card-content>
    <mat-list>
      <mat-list-item>
        <span matListItemTitle>Email</span>
        <span matListItemLine>{{ profile.email }}</span>
      </mat-list-item>
      <mat-list-item>
        <span matListItemTitle>Member since</span>
        <span matListItemLine>{{ profile.memberSince }}</span>
      </mat-list-item>
    </mat-list>
  </mat-card-content>
</mat-card>
