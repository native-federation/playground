<a matButton="text" navIntent="programme.list">
  <svg
    matButtonIcon
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <line x1="19" y1="12" x2="5" y2="12" />
    <polyline points="12 19 5 12 12 5" />
  </svg>
  Back to programme
</a>
@if (film(); as film) {
  <article>
    <app-poster class="poster" [poster]="film.poster" [tint]="film.tint" />
    <div class="info">
      <h1>{{ film.title }}</h1>
      <mat-chip-set role="list" aria-label="Film details">
        <mat-chip role="listitem">
          <span matChipAvatar aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </span>
          {{ film.runtimeMinutes }} min
        </mat-chip>
        <mat-chip role="listitem">
          <span matChipAvatar aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
          </span>
          {{ film.ageLabel }}
        </mat-chip>
      </mat-chip-set>
      <p class="synopsis">{{ film.synopsis }}</p>
    </div>
  </article>
} @else {
  <p role="status">Film not found.</p>
}
