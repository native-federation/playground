<header>
  <mat-toolbar>
    <a class="brand" routerLink="/">
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" />
        <path d="m6.2 5.3 3.1 3.9" />
        <path d="m12.4 3.4 3.1 4" />
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
      </svg>
      Cinema
    </a>
    <nav aria-label="Main">
      @for (entry of menu; track entry.basePath) {
        @let current = isCurrent(entry.basePath);
        @for (link of entry.links; track link.id) {
          <a
            [matButton]="current ? 'tonal' : 'text'"
            [navIntent]="link.id"
            [attr.aria-current]="current ? 'page' : null"
          >
            {{ link.label }}
          </a>
        }
        @for (fragment of entry.fragments; track fragment.element) {
          <app-remote-fragment [remoteName]="fragment.remoteName" [element]="fragment.element" />
        }
      }
    </nav>
  </mat-toolbar>
</header>
<main><router-outlet /></main>
<footer>Cinema: a Native Federation polyrepo demo.</footer>
<app-remote-switcher />
<app-event-log-panel />
