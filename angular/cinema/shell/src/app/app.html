<header>
  <mat-toolbar>
    <a class="brand" navIntent="programme.list">
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" />
        <path d="m6.2 5.3 3.1 3.9" />
        <path d="m12.4 3.4 3.1 4" />
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
      </svg>
      Cinema
    </a>
    <nav aria-label="Main">
      @let programme = isCurrent('programme.list');
      <a
        [matButton]="programme ? 'tonal' : 'text'"
        navIntent="programme.list"
        [attr.aria-current]="programme ? 'page' : null"
      >
        Programme
      </a>
      @let points = isCurrent('loyalty.points');
      <a
        [matButton]="points ? 'tonal' : 'text'"
        navIntent="loyalty.points"
        [attr.aria-current]="points ? 'page' : null"
      >
        Points
      </a>
      <mfe-loyalty-badge mfeRemote="@cinema/loyalty" />
      @let account = isCurrent('account.profile');
      <a
        [matButton]="account ? 'tonal' : 'text'"
        navIntent="account.profile"
        [attr.aria-current]="account ? 'page' : null"
      >
        Account
      </a>
    </nav>
  </mat-toolbar>
</header>
<main><router-outlet /></main>
<mfe-notifications-toast mfeRemote="@cinema/notifications" />
<footer>Cinema: a Native Federation polyrepo demo.</footer>
