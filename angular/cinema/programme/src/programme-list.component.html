<hgroup>
  <h1>Programme</h1>
  <p>This week's screenings in the hall.</p>
</hgroup>
<ul class="grid" role="list">
  @for (screening of screenings; track screening.screeningId) {
    @let filmCardId = 'film-' + screening.screeningId;
    @let whenId = 'when-' + screening.screeningId;
    <li>
      <mat-card appearance="outlined" role="group" [attr.aria-labelledby]="filmCardId + ' ' + whenId">
        <mat-card-content>
          <!-- Fragment contract: ids only, as attributes (docs/architecture.md) -->
          <mfe-film-card [id]="filmCardId" [attr.film-id]="screening.filmId" />
          <!-- ngPreserveWhitespaces keeps the space between day and time in the group label -->
          <p class="when" [id]="whenId" ngPreserveWhitespaces>
            <span class="day">{{ screening.day }}</span>
            <time class="time" [attr.datetime]="screening.time">{{ screening.time }}</time>
          </p>
        </mat-card-content>
        <mat-card-actions>
          <mfe-booking-start [attr.screening-id]="screening.screeningId" />
        </mat-card-actions>
      </mat-card>
    </li>
  }
</ul>
