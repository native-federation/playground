<h1>Your points</h1>
<mat-card appearance="filled" class="balance">
  <svg
    width="40"
    height="40"
    viewBox="0 0 24 24"
    fill="currentColor"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <polygon
      points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
    />
  </svg>
  <p class="total">
    <span class="value">{{ points() }}</span>
    <!-- the leading space keeps the text "20 points"; the flex gap hides it -->
    <span class="unit"> points</span>
  </p>
  <p class="rate">You earn {{ pointsPerTicket }} points per ticket.</p>
</mat-card>
